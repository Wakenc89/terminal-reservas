# Paso 0 - Entorno de desarrollo (Informe 3.5: "entorno local controlado")
# Tres contenedores = tres capas de la arquitectura (Informe 4.3.1.9, Fig. 19)
services:
  db:                       # Capa de datos: PostgreSQL
    image: postgres:16-alpine
    container_name: tlp_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: America/La_Paz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # se ejecuta solo la 1.ª vez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:                      # Capa de lógica de negocio: Node.js + Express (API REST)
    build: ./api
    container_name: tlp_api
    env_file: .env
    environment:
      DB_HOST: db
      TZ: America/La_Paz
    ports:
      - "4000:4000"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:                      # Capa de presentación: React + Tailwind (SPA)
    build: ./web
    container_name: tlp_web
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
